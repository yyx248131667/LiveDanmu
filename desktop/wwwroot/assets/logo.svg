<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#533483;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景圆 -->
  <circle cx="50" cy="50" r="45" fill="url(#grad1)" opacity="0.2"/>
  
  <!-- 主图标 - 弹幕符号 -->
  <g transform="translate(50, 50)">
    <!-- 对话框 -->
    <path d="M -25 -15 L 25 -15 L 25 10 L 5 10 L 0 15 L -5 10 L -25 10 Z" 
          fill="none" stroke="url(#grad1)" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- 弹幕线条 -->
    <line x1="-15" y1="-8" x2="15" y2="-8" stroke="url(#grad1)" stroke-width="2" stroke-linecap="round"/>
    <line x1="-15" y1="0" x2="10" y2="0" stroke="url(#grad1)" stroke-width="2" stroke-linecap="round"/>
    
    <!-- 装饰点 -->
    <circle cx="-20" cy="-25" r="2" fill="#e94560"/>
    <circle cx="20" cy="-25" r="2" fill="#533483"/>
    <circle cx="0" cy="-30" r="2" fill="#e94560"/>
  </g>
</svg>
